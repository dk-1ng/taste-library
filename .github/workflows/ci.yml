name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Policy (trailers, media)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit carries the Assisted-by trailer and no AI co-author lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an' "$c")"
            if [ "$author" = "dependabot[bot]" ]; then continue; fi
            subject="$(git log -1 --format='%s' "$c")"
            trailer="$(git log -1 --format='%(trailers:key=Assisted-by,valueonly)' "$c" | tr -d '[:space:]')"
            if [ -z "$trailer" ]; then
              echo "::error::$c ($subject) has no 'Assisted-by:' trailer."
              fail=1
            fi
            if git log -1 --format='%B' "$c" | grep -qiE '^co-authored-by:.*(claude|anthropic)|generated with .*claude'; then
              echo "::error::$c ($subject) has an AI 'Co-Authored-By' or 'Generated with' line."
              fail=1
            fi
          done
          exit "$fail"

      - name: No media outside examples/sample-library/
        run: |
          bad="$(git ls-files | grep -iE '\.(png|jpe?g|gif|webp|avif|bmp|tiff?|heic|svg|mp4|webm|mov|m4v|mkv|avi)$' | grep -v '^examples/sample-library/' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Media files are only allowed under examples/sample-library/:"
            echo "$bad"
            exit 1
          fi

  hooks:
    name: Git hooks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pre-push hook behaves the same on every platform
        shell: bash
        run: sh .github/scripts/test-pre-push.sh

  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
