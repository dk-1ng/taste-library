name: Feature request
description: An idea that would make taste-library more useful.
labels: ["type: feature", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem before the solution. Do not attach screenshots of third-party designs.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it could work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
